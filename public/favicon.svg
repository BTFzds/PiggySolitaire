<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#1f6b4a"/>
  <!-- card -->
  <rect x="28" y="12" width="22" height="30" rx="3" fill="#f7f3e8" stroke="#c9a35a" stroke-width="1.5"/>
  <text x="35" y="28" fill="#b33a32" font-size="11" font-family="Georgia" font-weight="700">A</text>
  <text x="34" y="38" fill="#b33a32" font-size="10">e</text>
  <!-- pig snout -->
  <ellipse cx="22" cy="40" rx="14" ry="12" fill="#f0b8b0"/>
  <ellipse cx="17" cy="40" rx="2.2" ry="3" fill="#d48880"/>
  <ellipse cx="27" cy="40" rx="2.2" ry="3" fill="#d48880"/>
  <!-- ears -->
  <ellipse cx="12" cy="30" rx="4" ry="5" fill="#e8a098" transform="rotate(-20 12 30)"/>
  <ellipse cx="32" cy="30" rx="4" ry="5" fill="#e8a098" transform="rotate(20 32 30)"/>
  <!-- spider leg hint -->
  <path d="M44 48 Q52 44 56 52" stroke="#c9a35a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M42 52 Q50 56 54 60" stroke="#c9a35a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
